name: CI Pipeline for C#

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Or 'windows-latest' if you're targeting Windows.

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up .NET 8.0 SDK
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '8.0.x'  # Specify .NET 8.0 version here

    - name: Restore dependencies
      run: dotnet restore

    - name: Build the project
      run: dotnet build --configuration Release

    - name: Run tests
      run: dotnet test --configuration Release

    - name: Install Codacy CLI
      run: |
        curl -sSL https://download.codacy.com/cli/latest/linux/codacy-cli-linux-x86_64.tar.gz -o codacy-cli.tar.gz
        tar -xvzf codacy-cli.tar.gz

    - name: Run Codacy analysis
      env:
        CODACY_PROJECT_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      run: |
        ./codacy-cli analyze --token $CODACY_PROJECT_API_TOKEN
