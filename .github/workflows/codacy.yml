name: CI with Codacy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up .NET SDK (Targeting .NET 8.0)
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.0.x'  # Use .NET 8.0 SDK

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Step 4: Build the project
      - name: Build the project
        run: dotnet build --configuration Release

      # Step 5: Run tests
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Step 6: Install Codacy Coverage Reporter
      - name: Install Codacy Coverage Reporter
        run: |
          curl -Ls https://github.com/codacy/codacy-coverage-reporter/releases/download/v5.0.0/codacy-coverage-reporter-5.0.0-linux-amd64 -o codacy-coverage-reporter
          chmod +x codacy-coverage-reporter
          mv codacy-coverage-reporter /usr/local/bin/

      # Step 7: Upload coverage to Codacy
      - name: Upload coverage to Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          codacy-coverage-reporter upload --repo-token ${{ secrets.CODACY_API_TOKEN }}
