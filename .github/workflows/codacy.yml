name: Codacy Analysis on Pull Request

on:
  pull_request:
    branches:
      - cdea  # Trigger only when a pull request targets the 'cdea' branch

jobs:
  codacy_analysis:
    runs-on: ubuntu-latest  # Or 'windows-latest' if you're targeting Windows.

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Codacy CLI
      run: |
        curl -sSL https://download.codacy.com/cli/latest/linux/codacy-cli-linux-x86_64.tar.gz -o codacy-cli.tar.gz
        tar -xvzf codacy-cli.tar.gz -C /usr/local/bin

    - name: Run Codacy analysis
      env:
        CODACY_PROJECT_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      run: |
        codacy-cli analyze --token $CODACY_API_TOKEN
