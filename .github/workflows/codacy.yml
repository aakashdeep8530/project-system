name: Codacy Analysis for C#

on:
  push:
    branches:
      - main  # or the default branch
  pull_request:
    branches:
      - main  # or the default branch

jobs:
  codacy:
    runs-on: ubuntu-latest  # You can use windows-latest if you're working in Windows containers

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up .NET Core SDK
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '6.0'  # Change this to your project's .NET version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release

    - name: Run tests (optional, if you have tests)
      run: dotnet test --configuration Release

    - name: Install Codacy CLI
      run: |
        curl -sSL https://download.codacy.com/cli/latest/linux/codacy-cli-linux-x86_64.tar.gz -o codacy-cli.tar.gz
        tar -xvzf codacy-cli.tar.gz

    - name: Run Codacy analysis
      env:
        CODACY_PROJECT_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      run: |
        ./codacy-cli analyze --token $CODACY_PROJECT_API_TOKEN
